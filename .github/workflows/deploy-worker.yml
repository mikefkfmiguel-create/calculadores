# Publica o Worker do Assistente no Cloudflare.
#
# Até aqui isto era um `wrangler deploy` à mão, do PC do mike — o que
# significa que uma alteração ao Worker ficava em `main` sem estar no ar, sem
# nada a dizê-lo. É exactamente o que aconteceu com a memória do Assistente:
# ficou merged e inactiva.
#
# Dispara sozinho quando algo dentro de `worker/` entra em `main`, e também à
# mão (Actions → "Publicar o Worker" → "Run workflow") para quando se quer
# republicar sem ter mexido em código — por exemplo depois de trocar um
# secret no Cloudflare.
name: Publicar o Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# Dois merges seguidos não se atropelam: o segundo espera pelo primeiro, em
# vez de haver duas publicações a correr ao mesmo tempo para o mesmo Worker.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Só o que é preciso para ler o próprio repositório.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      # Antes de gastar tempo a instalar nada: se o que falta é configuração,
      # é melhor dizê-lo já e por palavras, do que deixar o wrangler falhar
      # lá à frente com um erro de API.
      - name: Confirmar que está tudo configurado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          falhou=0

          # O único segredo a sério desta publicação. O resto (conta, ids das
          # KV) são identificadores e vivem no wrangler.toml -- um secret a
          # menos é um secret a menos para alguém ter de repor daqui a um ano.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            echo "::error::Cria-o no Cloudflare em My Profile → API Tokens, com o modelo 'Edit Cloudflare Workers'."
            falhou=1
          fi

          if ! grep -q '^account_id' wrangler.toml; then
            echo "::error::O wrangler.toml não tem account_id."
            falhou=1
          fi

          # Enquanto os ids das KV forem os do exemplo, a publicação PASSA e
          # as partilhas/registos/feedback ficam partidos em silêncio -- que é
          # pior do que não publicar.
          if grep -q "cola-aqui-o-id" wrangler.toml; then
            echo "::error::O wrangler.toml ainda tem os ids de exemplo das KV ('cola-aqui-o-id')."
            echo "::error::Corre 'npx wrangler kv namespace list' e põe lá os ids reais de PARTILHAS, REGISTOS e FEEDBACK."
            falhou=1
          fi

          [ "$falhou" = "0" ] || exit 1
          echo "Configuração ok."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # `npm ci` e não `npm install`: instala exactamente o que está no
      # package-lock.json, para a versão do wrangler que publica ser a mesma
      # que foi testada, e não a que por acaso for a mais recente nesse dia.
      - name: Instalar o wrangler
        run: npm ci

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Dizer o que ficou no ar
        if: success()
        run: |
          echo "### Worker publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Os **secrets** do Worker (ANTHROPIC_API_KEY, ADMIN_TOKEN, RESEND_API_KEY) vivem no Cloudflare e não são tocados por isto — uma publicação nunca os apaga." >> "$GITHUB_STEP_SUMMARY"
