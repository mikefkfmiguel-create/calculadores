name = "calculadores-assistente"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Site(s) autorizados a chamar este Worker (separados por vírgula, sem
# barra final). Ajusta ao(s) domínio(s) reais onde a app está publicada.
# Isto é verificado no próprio Worker (não só no browser via CORS), por
# isso continua a bloquear pedidos diretos (curl/scripts) de outras origens.
[vars]
ALLOWED_ORIGINS = "https://mikefkfmiguel-create.github.io"

# Guarda os projetos partilhados pelo botão "🔗 Link para ver" do Preview,
# por 1 dia, e depois apaga-os sozinho (expirationTtl, no código). Cria-se
# UMA vez, antes do primeiro deploy desta versão:
#   wrangler kv namespace create PARTILHAS
# Esse comando devolve um bloco com um "id" — troca "cola-aqui-o-id" por ele
# e faz `wrangler deploy` a seguir. Sem isto, o link de partilha não funciona
# (o resto do Worker continua a funcionar na mesma).
[[kv_namespaces]]
binding = "PARTILHAS"
id = "cola-aqui-o-id"

# Guarda cada pedido ao Assistente (texto + o que a IA extraiu, nunca a
# imagem em si) por 30 dias, para revisão semanal — ver REGISTO_VALIDADE_SEGUNDOS
# e listarRegistos() em src/index.js. Cria-se UMA vez, do mesmo jeito que a
# PARTILHAS acima:
#   wrangler kv namespace create REGISTOS
# Troca "cola-aqui-o-id-registos" pelo "id" que esse comando devolver, e faz
# `wrangler deploy` a seguir. Sem isto, o Assistente continua a funcionar
# na mesma — só fica sem histórico para a revisão.
[[kv_namespaces]]
binding = "REGISTOS"
id = "cola-aqui-o-id-registos"

# A chave da Anthropic NUNCA vai aqui nem em nenhum ficheiro do repositório —
# define-se como secret depois do primeiro deploy:
#   wrangler secret put ANTHROPIC_API_KEY

# Idem para o token que protege a rota /registos (revisão semanal) — nunca
# aqui, define-se como secret:
#   wrangler secret put ADMIN_TOKEN
